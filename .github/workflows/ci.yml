name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('**/*.nix', 'npins/sources.json') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-

      - name: Build
        timeout-minutes: 20
        run: nix-shell --run 'zig build -Doptimize=ReleaseFast --summary all'

      - name: Unit and end-to-end tests
        timeout-minutes: 20
        run: nix-shell --run 'zig build check --summary all --test-timeout 10m'

      - name: Language conformance
        timeout-minutes: 20
        run: nix-shell --run 'zig build test-lang -Doptimize=ReleaseFast --summary all'
