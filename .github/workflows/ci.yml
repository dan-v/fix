name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15

    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build and test
        run: |
          nix-shell --run '
            zig build -Doptimize=ReleaseFast
            zig build check
            zig build test-lang -Doptimize=ReleaseFast
          '
