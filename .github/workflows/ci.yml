name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-v2-${{ matrix.system }}-${{ hashFiles('**/*.nix', 'npins/sources.json') }}
          restore-prefixes-first-match: nix-v2-${{ matrix.system }}-

      - name: Configure pinned NIX_PATH
        run: |
          nixpkgs="$(nix eval --raw --impure --expr '(import ./npins).nixpkgs.outPath')"
          echo "NIX_PATH=nixpkgs=$nixpkgs" >> "$GITHUB_ENV"

      - name: Build
        timeout-minutes: 20
        run: nix-shell --run 'zig build -Doptimize=ReleaseFast --summary all'

      - name: Build pinned Nix package
        timeout-minutes: 20
        run: nix-build default.nix -A fix --no-out-link

      - name: Static checks
        timeout-minutes: 10
        run: nix-shell --run 'zig build check-static --summary all'

      - name: Model-check concurrency protocols
        if: matrix.system == 'x86_64-linux'
        timeout-minutes: 10
        run: nix-shell --run 'zig build check-models --summary all'

      - name: Base tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-base --verbose --summary all'

      - name: Syntax tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-syntax --verbose --summary all'

      - name: Runtime tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-runtime --verbose --summary all'

      - name: Store tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-store --verbose --summary all'

      - name: Fetcher tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-fetchers --verbose --summary all'

      - name: Evaluator tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-expr --verbose --summary all'

      - name: Focused concurrency tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-concurrency --verbose --summary all'

      # ReleaseSafe: safety checks stay on while the optimizer elides the
      # dead union operand copies that safe-Debug lowering materializes,
      # which alias embedded atomics and would report as artifact races.
      - name: ThreadSanitizer concurrency tests
        if: matrix.system == 'x86_64-linux'
        timeout-minutes: 20
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66:suppressions=${{ github.workspace }}/test/tsan.supp
        run: nix-shell --run 'zig build test-concurrency -Dtsan -Doptimize=ReleaseSafe --verbose --summary all'

      - name: Integration tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-integration --verbose --summary all'

      - name: CLI tests
        timeout-minutes: 12
        run: nix-shell --run 'zig build test-cli --verbose --summary all'

      - name: Flake end-to-end tests
        timeout-minutes: 7
        run: nix-shell --run 'zig build test-e2e --summary all -- flake'

      - name: REPL end-to-end tests
        timeout-minutes: 7
        run: nix-shell --run 'zig build test-e2e --summary all -- repl'

      - name: Language conformance
        timeout-minutes: 20
        run: nix-shell --run 'zig build test-lang -Doptimize=ReleaseFast --summary all'

      - name: Benchmark fixture differential
        if: matrix.system == 'x86_64-linux'
        timeout-minutes: 15
        run: nix-shell --run 'zig build test-bench-fixtures -Doptimize=ReleaseFast --summary all'

  daemon-compat:
    name: daemon / ${{ matrix.implementation }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        implementation: [cppnix, lix]

    steps:
      - uses: actions/checkout@v6
      - name: Install CppNix
        if: matrix.implementation == 'cppnix'
        uses: cachix/install-nix-action@v31
      - name: Install Lix
        if: matrix.implementation == 'lix'
        uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-06-15
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: daemon-v2-${{ matrix.implementation }}-${{ hashFiles('**/*.nix', 'npins/sources.json') }}
          restore-prefixes-first-match: daemon-v2-${{ matrix.implementation }}-

      - name: Configure pinned NIX_PATH
        run: |
          nixpkgs="$(nix eval --raw --impure --expr '(import ./npins).nixpkgs.outPath')"
          echo "NIX_PATH=nixpkgs=$nixpkgs" >> "$GITHUB_ENV"

      - name: Report daemon implementation
        run: nix --version

      - name: Build
        timeout-minutes: 20
        run: nix-shell --run 'zig build -Doptimize=ReleaseFast --summary all'

      - name: Real-daemon compatibility
        timeout-minutes: 10
        env:
          FIX_REQUIRE_DAEMON: "1"
        run: nix-shell --run 'zig build test-e2e --summary all -- daemon'
