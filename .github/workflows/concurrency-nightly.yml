name: Concurrency stress

on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    env:
      STRESS_SEED: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: concurrency-${{ matrix.system }}-${{ hashFiles('**/*.nix', 'npins/sources.json') }}
          restore-prefixes-first-match: concurrency-${{ matrix.system }}-

      - name: Debug stress
        timeout-minutes: 30
        run: nix-shell --run "zig build stress-concurrency --summary all -- --seed $STRESS_SEED --iterations 20"

      - name: ReleaseFast stress
        timeout-minutes: 30
        run: nix-shell --run "zig build stress-concurrency -Doptimize=ReleaseFast --summary all -- --seed $STRESS_SEED --iterations 100"

      # TSan lanes build ReleaseSafe: safety checks stay on, and the optimizer
      # elides the dead whole-union operand copies that safe-Debug lowering
      # materializes for tag dispatch — those alias embedded atomics (e.g. the
      # merge-flatten memo) and would report as races on reads no source-level
      # access performs.
      - name: ThreadSanitizer stress
        if: matrix.system == 'x86_64-linux'
        timeout-minutes: 30
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66:suppressions=${{ github.workspace }}/test/tsan.supp
        run: nix-shell --run "zig build stress-concurrency -Dtsan -Doptimize=ReleaseSafe --summary all -- --seed $STRESS_SEED --iterations 20"

      # The synthetic stress workloads cannot reproduce the module-fixpoint
      # shapes where past real races surfaced; run the real-world bench
      # fixtures as a parallel-eval differential against reference Nix. On
      # aarch64 this is also the only weak-memory coverage of a real eval —
      # TSan on x86 cannot see ordering bugs that TSO hides.
      - name: Real-eval differential (w=8)
        timeout-minutes: 45
        run: nix-shell --run 'zig build test-bench-fixtures -Doptimize=ReleaseFast --summary all -- realworld --workers 8'

      - name: ThreadSanitizer real-eval differential (w=8)
        if: matrix.system == 'x86_64-linux'
        timeout-minutes: 90
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66:suppressions=${{ github.workspace }}/test/tsan.supp
        run: nix-shell --run 'zig build test-bench-fixtures -Dtsan -Doptimize=ReleaseSafe --summary all -- realworld --workers 8'
